<!-- List in HTML -->
 <!-- Ordered list and Unordered list -->
<!-- ordered list - <ol>,<li> -->
<!-- unordered list - <ul>,<li> -->
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <!-- Unorded list -->
        <ul >
            <li>Apple</li>
            <li>Mango</li>
            <li>Banana</li>
            <li>Watermelon</li>
        </ul>
        <!-- Subset -->
        <ul>
            <li>Apple</li>
            <ul>
                <li>Color: red</li>
                <li>Season: winters</li>
            </ul>
            <li>Seasons</li>
            <ul>
                <li>Winter</li>
                <li>Summer</li>
                <li>Rainy</li>
            </ul>
            <li>Fruits</li>
            <ul>
                <li>Mango</li>
                <li>Litchi</li>
            </ul>
        </ul>
    </body>
    </html>
