<!-- Tables: <table> </table> -->
<!-- <tr> : used to display table row -->
<!-- <td>: used to display table data -->
<!-- <th>: used to display table header -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table>
        <tr>
            <th>Class</th>
            <th>Marks</th>
            <th>Passing year</th>
        </tr>
        <tr>
            <td>SSLC</td>
            <td>92.48%</td>
            <td>2023</td>
        </tr>
        <tr>
            <td>PUC</td>
            <td>79.9%</td>
            <td>2025</td>
        </tr>
        <tr>
            <td>Engineering</td>
            <td>9.95 CGPA</td>
            <td>2029</td>
        </tr>
    </table>
</body>
</html>
