<!-- Tables: <table> </table> -->
<!-- <tr> : used to display table row -->
<!-- <td>: used to display table data -->
<!-- <th>: used to display table header -->
<!-- <caption> is used for adding caption -->
<!-- <thead>: to wrap table head -->
<!-- <tbody>: to wrap table body -->
<!-- <callspan>: used to merge the same heading for more column -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table>
        <caption>Education info</caption>
        <thead>
        <tr>
            <th>Class</th>
            <th>Marks</th>
            <th>Passing year</th>
        </tr>
        </thead>

        <tbody>
        <tr>
            <td>SSLC</td>
            <td>92.48%</td>
            <td>2023</td>
        </tr>
        <tr>
            <td>PUC</td>
            <td>79.9%</td>
            <td>2025</td>
        </tr>
        <tr>
            <td>Engineering</td>
            <td>9.95 CGPA</td>
            <td>2029</td>
        </tr>
        </tbody>
    </table>
    <br>
    <br>

    <!-- Callspan Example -->
     <table>
        <tr>
            <th callspan="3">Customer_Information</th>
        </tr>
        <tr>
            <td>Alice</td>
            <td>Lamborgini</td>
            <td>2023</td>
        </tr>
        <tr>
            <td>Jude</td>
            <td>Bently</td>
            <td>2025</td>
        </tr>
        <tr>
            <td>Lamine</td>
            <td>BMW</td>
            <td>2026</td>
        </tr>
     </table>
</body>
</html>
