<!-- HTML Forms -->
<!-- <form> form content </form> -->
<!-- action attributer is used for backend -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/action.php">
        <input type="text" placeholder="username">
        <br>
        <input type="password" placeholder="password">
        <br>
        <br>
        <input type="radio" value="class XI" name="class"> Class XI 
        <input type="radio" value="class XII" name="class"> Class XII
        <br>
        <br>
        <label for="name">Name</label>
        <input type="text" value="name" name="name" placeholder="Enter your name" id="name">
        <br>
        <br>
        <label> Pick the subjects </label>
        <br>
        <label for="maths">Maths</label>
        <input type="checkbox" value="maths" name="subject" id="maths">
        <label for="physics">Physics</label>
        <input type="checkbox" value="physics" name="subject" id="physics">
        <label for="social">Social Science</label>
        <input type="checkbox" value="social" name="subject" id="social">
        <label for="english">English</label>
        <input type="checkbox" value="english" name="subject" id="english">
        <br>
        <br>
        <label for="feedback">Feedback</label>
        <textarea rows=5 name="feedback" id="feedback" plaaceholder="Please give your feedback"></textarea>

    </form>
</body>
</html>
